[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-trajectory-diffusion"
version = "0.1.0"
description = "Budget-conditioned correction of unfinished trajectory diffusion"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<3", "torch>=2.2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
adaptive-diffusion = "adaptive_diffusion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
